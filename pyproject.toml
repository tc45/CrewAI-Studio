[tool.poetry]
name = "crewai-studio"
version = "0.1.0"
description = "A Streamlit-based UI for CrewAI"
authors = ["CrewAI Studio Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
crewai = {version = ">=0.119.0", python = ">=3.10,<3.13"}
crewai-tools = {version = "*", python = ">=3.10,<3.13"}
langchain = ">=0.0.267"
langchain-community = ">=0.0.14"
langchain-core = ">=0.1.9"
langchain-openai = "*"
langchain-groq = "*"
langchain-anthropic = "*"
langchain-ollama = {version = "*", python = ">=3.10,<3.13"}
streamlit = "*"
python-dotenv = "*"
pdfminer-six = "*"
sqlalchemy = "*"
psycopg2-binary = "*"
snowflake-connector-python = "*"
markdown = "*"
docling = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.5.1"
pre-commit = "^3.3.3"
loguru = "^0.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "--cov=app --cov-report=term-missing"
